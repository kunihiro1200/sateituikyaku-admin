name: イエウール他決候補フラグ同期（週次）

on:
  schedule:
    # 毎週月曜 0:00 UTC = 日本時間 月曜 09:00 に実行
    - cron: '0 0 * * 1'
  # 手動実行も可能
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: イエウールデータシートからieul_competitorフラグを更新
        run: |
          echo "sync-ieul-competitors 開始: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # --fail-with-body: HTTP 4xx/5xx 時に curl が非ゼロ終了し、レスポンスボディも保持
          # -o でボディをファイルに分離し、-w でステータスコードのみ stdout に出力
          HTTP_CODE=$(curl -s \
            --fail-with-body \
            -o /tmp/ieul_sync_resp.txt \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SYNC_API_URL }}/api/sellers/sync-ieul-competitors") || true

          BODY=$(cat /tmp/ieul_sync_resp.txt 2>/dev/null || echo "(no response)")

          echo "ステータスコード: $HTTP_CODE"
          echo "レスポンス: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ 同期失敗 (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "✅ 同期成功"
