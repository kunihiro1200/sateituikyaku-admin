name: イエウール他決候補フラグ同期（週次）

on:
  schedule:
    # 毎週月曜 0:00 UTC = 日本時間 月曜 09:00 に実行
    - cron: '0 0 * * 1'
  # 手動実行も可能
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: イエウールデータシートからieul_competitorフラグを更新
        run: |
          echo "sync-ieul-competitors 開始: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://baikyaku-property-site3.vercel.app/api/sellers/sync-ieul-competitors")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "ステータスコード: $HTTP_CODE"
          echo "レスポンス: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ 同期失敗 (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "✅ 同期成功"
