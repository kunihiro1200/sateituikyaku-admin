name: 学校区データ年次更新チェック

on:
  schedule:
    # 毎年4月の全月曜日（02:00 UTC = 11:00 JST）
    # スクリプト内で day <= 7（第1月曜日のみ）チェックを行う
    - cron: '0 2 * 4 1'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（PR・Issue・コミット・DB更新を一切行わない）'
        type: boolean
        default: true
      force_run:
        description: '第1月曜チェックをスキップして強制実行（手動テスト用）'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係インストール
        run: |
          pip install pdfminer.six==20221105 pymupdf==1.27.2.3 requests==2.32.3 openpyxl==3.1.5 --quiet
          npm ci
        working-directory: backend

      - name: 一時ディレクトリ作成
        run: mkdir -p backend/tmp-update

      # ─────────────────────────────────────────────────────────────────────
      # メイン: 学校区データ更新チェック
      # ─────────────────────────────────────────────────────────────────────
      - name: 学校区データ取得・差分チェック
        id: check
        run: npx ts-node scripts/check-school-data-updates.ts
        working-directory: backend
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_RUN: ${{ inputs.force_run }}
          # ドライランでは tmp-update/ に書き込むだけで src/data/ は変更しない
          SCHOOL_OUTPUT_PATH: tmp-update/fukuoka-new.json

      # ─────────────────────────────────────────────────────────────────────
      # 全ソース取得成功 + 変更あり → PR 作成（⑤ 既存 PR は更新）
      # ─────────────────────────────────────────────────────────────────────
      - name: 変更あり - PR 作成または更新
        if: |
          steps.check.outputs.all_ok == 'true' &&
          steps.check.outputs.has_changes == 'true' &&
          inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          YEAR=$(date +%Y)
          BRANCH="school-data-update-${YEAR}"

          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"

          git add backend/src/data/fukuoka-school-address-map.json \
                   backend/src/data/oita-beppu-school-address-map.json \
                   backend/scripts/school-data-metadata.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: 学校区データ年次更新 ${YEAR}年4月"
            git push origin "$BRANCH"
          fi

          # ⑤ 既存 PR があれば更新、なければ新規作成
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          REPORT=$(cat backend/tmp-update/update-report.md 2>/dev/null || echo "レポートなし")
          TITLE="📚 学校区データ年次更新 ${YEAR}年4月 - 変更あり"

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$REPORT"
            echo "✅ 既存 PR #$EXISTING を更新しました"
          else
            gh pr create --title "$TITLE" --body "$REPORT" \
              --base main --head "$BRANCH" \
              --assignee "${{ github.repository_owner }}"
            echo "✅ PR を新規作成しました"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────────────────────────────
      # 全ソース取得成功 + 変更なし → Issue で通知
      # ─────────────────────────────────────────────────────────────────────
      - name: 変更なし - Issue 通知
        if: |
          steps.check.outputs.all_ok == 'true' &&
          steps.check.outputs.has_changes == 'false' &&
          inputs.dry_run != 'true'
        run: |
          YEAR=$(date +%Y)
          REPORT=$(cat backend/tmp-update/update-report.md 2>/dev/null || echo "レポートなし")
          gh issue create \
            --title "✅ 学校区データ年次確認 ${YEAR}年4月: 変更なし（全ソース確認済み）" \
            --body "$REPORT" \
            --assignee "${{ github.repository_owner }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────────────────────────────
      # ③ 一部取得失敗 → Issue のみ作成、PR は作成しない、既存データ維持
      # ─────────────────────────────────────────────────────────────────────
      - name: 取得失敗 - Issue 通知（PRは作成しない）
        if: |
          steps.check.outputs.all_ok == 'false' &&
          inputs.dry_run != 'true'
        run: |
          YEAR=$(date +%Y)
          REPORT=$(cat backend/tmp-update/update-report.md 2>/dev/null || \
                   cat backend/tmp-update/error-report.md 2>/dev/null || \
                   echo "詳細はActionsログを確認してください")
          gh issue create \
            --title "⚠️ 学校区データ取得未確認 ${YEAR}年4月 - 手動確認が必要" \
            --body "$REPORT" \
            --assignee "${{ github.repository_owner }}" \
            --label "school-data"
          echo "⚠️ 一部ソースの取得に失敗しました。既存データを維持します。PRは作成しません。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────────────────────────────
      # スクリプト自体がクラッシュした場合のフォールバック
      # ─────────────────────────────────────────────────────────────────────
      - name: 致命的エラー - Issue 通知
        if: failure() && inputs.dry_run != 'true'
        run: |
          YEAR=$(date +%Y)
          gh issue create \
            --title "❌ 学校区データ年次更新 ${YEAR}年4月 - 致命的エラー" \
            --body "スクリプト実行中にエラーが発生しました。**既存データは変更されていません。**

ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee "${{ github.repository_owner }}" \
            --label "school-data,bug"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ⑥ ドライラン時はログにレポートを出力するだけ
      - name: ドライラン - レポートをログに出力
        if: inputs.dry_run == 'true'
        run: |
          echo "=== DRY RUN - PR・Issue・コミット・DB更新は一切行いません ==="
          echo ""
          echo "all_ok: ${{ steps.check.outputs.all_ok }}"
          echo "has_changes: ${{ steps.check.outputs.has_changes }}"
          echo ""
          echo "=== 差分レポート ==="
          cat backend/tmp-update/update-report.md 2>/dev/null || \
          cat backend/tmp-update/error-report.md 2>/dev/null || \
          echo "(レポートなし)"
